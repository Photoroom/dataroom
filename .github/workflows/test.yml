name: Tests

on:
  push:
    branches:
      - main
      - dev-deploy
  pull_request:
    branches:
      - main

jobs:
  test:
    # Self-hosted runner where one is configured (CI_RUNNER repository
    # variable), GitHub-hosted otherwise.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432

      opensearch:
        image: opensearchproject/opensearch:3.3.0
        env:
          discovery.type: single-node
          plugins.security.disabled: true
          # Ensure the cluster starts in a writable state (some runner environments can inherit blocks)
          cluster.blocks.create_index: "false"
          cluster.blocks.read_only: "false"
          # CI runners can have very constrained Docker disk; disable disk watermarks for tests.
          cluster.routing.allocation.disk.threshold_enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: "DevOnly-pass43431"
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=50s"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 40
          --ulimit nofile=65536:65536
        ports:
          - 9200:9200

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (CI, conditional)
        run: |
          set -euo pipefail
          echo "== Disk before cleanup =="
          df -h
          # If available space is low, remove preinstalled toolchains we don't use in this workflow.
          avail_gb=$(df -BG / | awk 'NR==2 {gsub(/G/,"",$4); print $4}')
          if [ "${avail_gb:-0}" -lt 10 ]; then
            echo "Low disk (${avail_gb}G available). Cleaning up preinstalled toolchains..."
            sudo rm -rf /usr/share/dotnet || true
            sudo rm -rf /usr/local/lib/android || true
            sudo rm -rf /opt/ghc || true
            sudo apt-get clean || true
          else
            echo "Sufficient disk (${avail_gb}G available). Skipping cleanup."
          fi
          echo "== Disk after cleanup =="
          df -h

      - name: Create DB
        run: PGPASSWORD=postgres createdb -h localhost -p 5432 -U postgres dataroom

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: "npm"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y libsnappy-dev libcurl4-openssl-dev libssl-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.20"
          enable-cache: true

      # The venv is restored whole, keyed on the lockfile - skips reinstalling
      # and recompiling the C extensions (pycurl, python-snappy) on every run.
      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.13.0-${{ hashFiles('uv.lock') }}

      - name: Install Python dependencies
        run: uv sync --locked --all-groups

      - name: Collect static
        run: |
          source .venv/bin/activate
          python manage.py collectstatic -l --noinput --settings=backend.config.settings.test

      - name: Check for missing migrations
        run: |
          source .venv/bin/activate
          python manage.py makemigrations --check --dry-run --settings=backend.config.settings.test

      - name: Unblock OpenSearch
        run: |
          # Some runner environments start with very constrained Docker disk.
          # OpenSearch can then trigger the flood-stage watermark and set indices read-only (allow delete).
          # For CI tests, clear index-level blocks so we can index documents.
          set -euo pipefail

          # OpenSearch can accept connections before it is fully ready, and sometimes resets connections while starting.
          # Retry until the cluster answers a simple request.
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:9200/_cluster/health" >/dev/null; then
              break
            fi
            echo "Waiting for OpenSearch... ($i/30)"
            sleep 2
          done

          # Cluster-level settings are configured via service env in this workflow. Here we only clear any
          # index-level read-only blocks that might already be set.
          curl -sS --retry 20 --retry-all-errors --retry-delay 1 -X PUT "http://localhost:9200/_all/_settings" \
            -H "Content-Type: application/json" \
            -d '{"index.blocks.read_only_allow_delete": null, "index.blocks.read_only": null, "index.blocks.write": null}'
          echo ""

      - name: Setup opensearch
        # GH Actions services are exposed to the runner via localhost port mapping (not via service DNS).
        run: |
          source .venv/bin/activate
          python manage.py setup_opensearch --confirm --settings=backend.config.settings.test

      - name: Run tests
        run: |
          source .venv/bin/activate
          python -m pytest -n auto --junit-xml=.test_report.xml
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dataroom

      - uses: test-summary/action@v2
        with:
          paths: .test_report.xml
        if: always()
