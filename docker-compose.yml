volumes:
  dataroom_postgres_data: {}
  redis_data: {}
  opensearch_data: {}
  minio_data: {}

services:
  dataroom_postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_HOST: dataroom_postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dataroom
    volumes:
      - dataroom_postgres_data:/var/lib/postgresql/data:Z
      - ./compose/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
  dataroom_vite:
    image: node:22.14-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./:/app
      - /app/node_modules  # Anonymous volume to avoid overwriting node_modules
    ports:
      - "5173:5173"

  dataroom_django:
    build:
      context: .
      dockerfile: ./compose/django/Dockerfile

    image: dataroom_django
    command: python manage.py runserver 0.0.0.0:8000  # use django dev server for local development
    env_file:
      - ./.env
    environment:
      - DD_AGENT_HOST=dataroom_dogstatsd # Only locally, on ECS/Fargate it's localhost
      - NUM_GUNICORN_WORKERS=2
    depends_on:
      - dataroom_postgres
      - opensearch
      - minio-init
      - dataroom_vite
    volumes:
      - ./:/app
    ports:
      - "8000:8000"

  dataroom_tasks:
    # Local equivalent of the prod `backend-tasks` ECS service: runs the task
    # runner (group OS-denorm sync, deletions, thumbnails, ...). Kept to a
    # single Dask worker so it's light enough for a dev machine.
    image: dataroom_django
    command: python -m backend.task_runner.run --settings local --workers 1 --threads 2
    env_file:
      - ./.env
    environment:
      - DD_AGENT_HOST=dataroom_dogstatsd
    depends_on:
      - dataroom_django
      - dataroom_postgres
      - opensearch
      - minio-init
    volumes:
      - ./:/app

  dataroom_dogstatsd:
    image: datadog/agent
    environment:
      - DD_APM_MAX_TPS=300
      - DD_APM_ERROR_TPS=300
      - DD_API_KEY=${DATADOG_API_KEY}
      - DD_APM_ENABLED=true
      - DD_PROCESS_AGENT_ENABLED=true
      - DD_SITE=datadoghq.eu
      - DD_APM_MAX_CPU_PERCENT=0
      - DD_TAGS=env:${DATADOG_ENV}
      - DD_ENV=${DATADOG_ENV}
      - DD_APM_IGNORE_RESOURCES="GET /_health/"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc/:/host/proc/:ro
      - /etc/passwd:/etc/passwd:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro

  opensearch:
    image: opensearchproject/opensearch:3.3.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=DevOnly-pass43431
      - _JAVA_OPTIONS=-XX:UseSVE=0  # required to run on Apple Silicon
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    restart: always

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/dataroom-local;
      mc anonymous set download myminio/dataroom-local;
      exit 0;
      "
