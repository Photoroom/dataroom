volumes:
  dataroom_postgres_data: {}
  dagster_home: {}
  redis_data: {}
  opensearch_data: {}
  minio_data: {}

services:
  dataroom_postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_HOST: dataroom_postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dataroom
    volumes:
      - dataroom_postgres_data:/var/lib/postgresql/data:Z
      - ./compose/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
  dataroom_vite:
    image: node:22.14-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./:/app
      - /app/node_modules  # Anonymous volume to avoid overwriting node_modules
    ports:
      - "5173:5173"

  dataroom_django:
    build:
      context: .
      dockerfile: ./compose/django/Dockerfile

    image: dataroom_django
    command: python manage.py runserver 0.0.0.0:8000  # use django dev server for local development
    env_file:
      - ./.env
    environment:
      - DD_AGENT_HOST=dataroom_dogstatsd # Only locally, on ECS/Fargate it's localhost
      - NUM_GUNICORN_WORKERS=2
    depends_on:
      - dataroom_postgres
      - opensearch
      - minio-init
      - dataroom_vite
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    # reach a Dagster running on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        # Django rejects Host headers with underscores
        aliases:
          - dataroom-django

  dataroom_tasks:
    # Local equivalent of the prod `backend-tasks` ECS service: runs the task
    # runner (group OS-denorm sync, deletions, thumbnails, ...). Kept to a
    # single Dask worker so it's light enough for a dev machine.
    image: dataroom_django
    command: python -m backend.task_runner.run --settings local --workers 1 --threads 2
    env_file:
      - ./.env
    environment:
      - DD_AGENT_HOST=dataroom_dogstatsd
    depends_on:
      - dataroom_django
      - dataroom_postgres
      - opensearch
      - minio-init
    volumes:
      - ./:/app

  dataroom_dagster:
    # Local Dagster serving the dagster/ code location.
    build:
      context: .
      dockerfile: ./dagster/Dockerfile
      args:
        EXTRAS: "[dev]"
    image: dataroom_dagster
    # torch DataLoader workers share tensors over /dev/shm, the 64MB default is too small
    shm_size: 1g
    command: dagster dev -h 0.0.0.0 -p 3000 -m dataroom
    env_file:
      - ./.env
    environment:
      DAGSTER_HOME: /dagster_home
      DAGSTER_TELEMETRY_ENABLED: "false"
      DATAROOM_DEV_API_URL: http://dataroom-django:8000
      # image URLs point at the host's minio, the container reaches it by service name
      DATAROOM_REWRITE_HOSTS: localhost:9000=minio:9000
      # CPU-sized training, prod keeps the code defaults
      CLASSIFIER_IMAGE_SIZE: "224"
      CLASSIFIER_TRAIN_ITERATIONS: "100"
      CLASSIFIER_MODELS_BUCKET: dataroom-local
      CLASSIFIER_MODELS_PREFIX: dataroom
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    volumes:
      - ./dagster:/app
      - dagster_home:/dagster_home
    ports:
      - "3000:3000"
    depends_on:
      - dataroom_django
      - minio-init

  dataroom_dogstatsd:
    image: datadog/agent
    environment:
      - DD_APM_MAX_TPS=300
      - DD_APM_ERROR_TPS=300
      - DD_API_KEY=${DATADOG_API_KEY}
      - DD_APM_ENABLED=true
      - DD_PROCESS_AGENT_ENABLED=true
      - DD_SITE=datadoghq.eu
      - DD_APM_MAX_CPU_PERCENT=0
      - DD_TAGS=env:${DATADOG_ENV}
      - DD_ENV=${DATADOG_ENV}
      - DD_APM_IGNORE_RESOURCES="GET /_health/"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc/:/host/proc/:ro
      - /etc/passwd:/etc/passwd:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro

  opensearch:
    image: opensearchproject/opensearch:3.3.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=DevOnly-pass43431
      - _JAVA_OPTIONS=-XX:UseSVE=0  # required to run on Apple Silicon
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    restart: always

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/dataroom-local;
      mc anonymous set download myminio/dataroom-local;
      exit 0;
      "
