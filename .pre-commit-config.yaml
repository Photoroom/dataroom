repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.4
    hooks:
      - id: ruff
        args: [ --fix ]
        files: backend/
      - id: ruff-format
        files: backend/

  - repo: https://github.com/pycqa/flake8
    rev: 5.0.4
    hooks:
      - id: flake8

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.20
    hooks:
      - id: uv-lock

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.32.0
    hooks:
      - id: eslint
        types: [file]
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        args:
          - '--fix'
          - '--no-warn-ignored'
          - '--report-unused-disable-directives'
          - '--max-warnings'
          - '0'
        additional_dependencies:
          - prettier@^3
          - eslint@^9.32.0
          - typescript-eslint@^8.19.0
          - eslint-config-prettier@^9
          - eslint-plugin-prettier@^5
          - "@typescript-eslint/parser@^7"
          - "@typescript-eslint/eslint-plugin@^7"
          - eslint-plugin-react@^7.34.1
          - eslint-plugin-react-hooks@^4.6.0
          - eslint-plugin-react-refresh@^0.4.3

  # Uses the prettier from package.json so this hook and `npm run format` cannot
  # disagree about formatting.
  #
  # Keep this file list in sync with the format/format:check scripts in
  # package.json: the hook only sees files that are in a commit, so anything it
  # formats but the scripts do not check can rot unnoticed.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write --no-error-on-unmatched-pattern
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx|json|css|scss|md)$

  - repo: local
    hooks:
      - id: typescript-check
        name: TypeScript type check
        entry: bash -c 'cd frontend && npm run typecheck'
        language: system
        files: frontend/.*\.(ts|tsx)$
        pass_filenames: false
