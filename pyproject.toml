[project]
name = "dataroom"
version = "1.0.0"
description = ""
authors = [
    {name = "Ales Kocjancic", email = "hi@ales.io"}
]
readme = "README.md"
requires-python = ">=3.13.0,<4"
dependencies = [
    "django[argon2]>=5.0.7,<6",
    "djangorestframework>=3.15.2,<4",
    "whitenoise[brotli]>=6.2.0,<7",
    "django-allauth>=0.58.2,<0.59",
    "django-annoying>=0.10.6,<0.11",
    "django-environ>=0.10.0,<0.11",
    "django-extensions>=3.1.5,<4",
    "django-model-utils>=4.2.0,<5",
    "boto3>=1.26.51,<2",
    "django-storages>=1.13.2,<2",
    "uvicorn>=0.20.0,<0.21",
    "gunicorn>=20.1.0,<21",
    "pillow>=10.1.0,<11",
    "django-vite>=2.0.2,<3",
    "django-jinja>=2.10.2,<3",
    "heroicons[jinja]>=2.11.0,<3",
    "psycopg2>=2.9.6,<3",
    "django-admin-shortcuts>=3.0.1,<4",
    "httpx>=0.28.0,<1",
    "pgvector>=0.2.3,<0.3",
    "django-filter>=23.4,<24",
    "ddtrace>=2.11.4,<3",
    "drf-spectacular>=0.26.5,<0.27",
    "numpy>=1.26.2,<2",
    "flask>=3.0.1,<4",
    "flask-httpauth>=4.8.0,<5",
    "aioboto3>=12.2.0,<13",
    "cryptography==41.0.7",
    "jsonschema>=4.21.1,<5",
    "aws-requests-auth>=0.4.3,<0.5",
    "requests-aws4auth>=1.2.3,<2",
    "opensearch-py>=2.5.0,<3",
    "gevent>=24.2.1,<25",
    "dask[distributed]>=2024.9.0,<2025",
    "onnxruntime>=1.16,<2",
    "regex>=2024.0.0",
    "bokeh>=3.5.2,<4",
]

[dependency-groups]
test = [
    "pytest>=7.2.1,<8",
    "pytest-asyncio>=0.21.1,<0.22",
    "pytest-mock>=3.14.0,<4",
    "freezegun>=1.2.2,<2",
    "pytest-django>=4.5.2,<5",
    "pytest-playwright>=0.3.0,<0.4",
    "pytest-xdist>=3,<4",
]
dev = [
    "black>=22.12.0,<23",
    "ruff>=0.5.4,<0.6",
    "flake8-django>=1.1.5,<2",
    "flake8>=5,<6",
    "django-debug-toolbar>=5.2.0,<6",
    "pre-commit>=2.17.0,<3",
]
develop = [
    "jupyter>=1.0.0,<2",
]

[tool.uv]
# This is an application, not an installable package — don't try to build/install the root.
package = false


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.config.settings.test"
FAIL_INVALID_TEMPLATE_VARS = false


[tool.black]
line-length = 120
target-version = ['py311']
skip-string-normalization = true
extend-exclude = '''
(
  /migrations/.+\.py
  |
  /config/settings/.+\.py
)
'''


[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "*/migrations/*.py",
    "*/opensearch_migrations/*.py",
    "*/config/settings/local.py",
    "*/config/settings/local.example.py",
]
lint.select = [
    "E",  # pycodestyle
    "W",  # pycodestyle
    "F",  # Pyflakes
    "B",  # flake8-bugbear
    "A",  # flake8-builtins
    "I",  # isort
    "N",  # pep8-naming
    "UP",  # pyupgrade
    "COM",  # flake8-commas
    "DTZ",  # flake8-datetimez
    "ISC",  # flake8-implicit-str-concat
    "G",  # flake8-logging-format
    "INP",  # flake8-no-pep420
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "T201",  # flake8-print
    "PT",  # flake8-pytest-style
    "SIM",  # flake8-simplify
    #"PTH",  # flake8-use-pathlib
    "RUF",  # Ruff-specific rules
    "T",  # flake8-print
]
lint.ignore = [
    "BLE",  # BlindExcept
    "N815",  # mixedCase variables
    "G004", # Logging statement uses f-string
    "COM812", # Causes conflicts with formatter
    "ISC001", # Causes conflicts with formatter
    "Q000", # don't enforce quote consistency
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.per-file-ignores]
"manage.py" = ["INP001"]
"backend/config/settings/*.py" = ["F405"]
